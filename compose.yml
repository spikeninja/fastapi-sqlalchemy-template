name: PROJECT_NAME-prod

x-logging: &logging-opts
  options:
    max-size: "100m"
    max-file: "8"

services:
  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: PROJECT_NAME_api_prod
    command: uv run uvicorn main:application_factory --workers 1 --host 0.0.0.0 --port 8001
    env_file:
      - prod.env
    ports:
      - 8001:8001
    depends_on:
      - redis
      - postgres_db
    logging:
      <<: *logging-opts
    networks:
      - default
      - monitoring

  queue:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: PROJECT_NAME_queue_prod
    command: uv run taskiq worker app.tasks.broker:broker -tp '**/tasks/tasks.py' -fsd
    volumes:
      - ./web/:/usr/src/app/
      - ./files/:/usr/files/
    env_file:
      - .env
    depends_on:
      - redis
    logging:
      <<: *logging-opts

  taskiq_admin:
    image: ghcr.io/taskiq-python/taskiq-admin:latest
    container_name: taskiq_admin
    ports:
      - 5558:3000
    env_file:
      - .env
    volumes:
      - ./web/taskiq-admin-data:/usr/database/
    logging:
      <<: *logging-opts

  redis:
    image: redis:7-alpine
    container_name: PROJECT_NAME_redis_prod
    volumes:
      - redis_data:/data
    logging:
      <<: *logging-opts

  postgres_db:
    image: postgres:17-alpine
    container_name: PROJECT_NAME_pgsql_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    logging:
      <<: *logging-opts

volumes:
  redis_data:
  postgres_data:
